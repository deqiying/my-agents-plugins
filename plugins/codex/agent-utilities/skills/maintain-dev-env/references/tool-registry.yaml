schema_version: 2
source: "Curated from manager-specific inventories; real install and config paths are represented with placeholders."
placeholders:
  home: "<HOME>"
  global_mise_config: "<GLOBAL_MISE_CONFIG>"
  local_mise_config: "<LOCAL_MISE_CONFIG>"
  mise_data_dir: "<MISE_DATA_DIR>"
tools:
  - id: "doggo"
    command: "doggo"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "utility"
    version_policy: "latest"
    check:
      - "doggo --version"
    notes: "DNS lookup utility used for quick network diagnostics."
  - id: "officecli"
    command: "officecli"
    package: "@officecli/officecli"
    manager_chain:
      - "npm"
      - "mise"
    install_strategy: "npm-global"
    update_owner: "npm"
    category: "agent-tool"
    version_policy: "latest"
    check:
      - "officecli --version"
      - "officecli help"
    notes: "Office document inspection, editing, validation, and rendering CLI distributed as @officecli/officecli, whose npm postinstall fetches the native binary. Canonical command is lowercase officecli. Install and update through npm under mise-managed Node; do not combine that copy with a mise GitHub backend installation or an independent auto-update owner."
  - id: "onesearch"
    command: "onesearch"
    package: "onesearch"
    manager_chain:
      - "npm"
      - "mise"
    install_strategy: "npm-global"
    update_owner: "npm"
    category: "agent-tool"
    version_policy: "latest"
    check:
      - "onesearch --version"
      - "onesearch doctor --format json"
      - "onesearch skills list --format json"
    notes: "Onesearch npm package for source-backed web research. Install or update with npm in the active mise-managed Node global prefix. Reinstall it through the Node postinstall policy when a new Node version is installed."
  - id: "opencli"
    command: "opencli"
    package: "@jackwener/opencli"
    manager_chain:
      - "npm"
      - "mise"
    install_strategy: "npm-global"
    update_owner: "npm"
    category: "agent-tool"
    version_policy: "latest"
    check:
      - "opencli --version"
      - "opencli list -f json"
    notes: "OpenCLI command and adapter workflow CLI distributed as @jackwener/opencli and requiring Node.js >= 20. Install or update with npm in the active mise-managed Node global prefix, and reinstall it through the Node postinstall policy when a new Node version is installed. Use opencli doctor only for browser-bridge diagnostics, not as the base installation check."
  - id: "go"
    command: "go"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "runtime"
    version_policy: "latest"
    check:
      - "go version"
    notes: "Go runtime and toolchain."
  - id: "java"
    command: "java"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "runtime"
    version_policy: "latest"
    check:
      - "mise ls java --json"
      - "mise which java"
      - "mise settings get java.shorthand_vendor"
      - "java -version"
      - "javac -version"
    notes: "Shared/global Java follows the latest release selected by mise. java@latest uses mise's java.shorthand_vendor, which should be verified as openjdk before applying or reporting this policy. Preserve the vendor unless the user requests a change. An activated mise shell should own JAVA_HOME; report stale manual JDK copies or environment variables instead of deleting them."
  - id: "maven"
    command: "mvn"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "utility"
    version_policy: "latest"
    check:
      - "mise ls maven --json"
      - "mise which mvn"
      - "mvn --version"
    notes: "Standalone Maven build tool managed directly by mise. Confirm that mvn --version reports the intended mise-managed Java runtime, and respect a project's Maven wrapper or toolchain requirements before changing project state."
  - id: "mvnd"
    command: "mvnd"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "utility"
    version_policy: "latest"
    check:
      - "mise ls mvnd --json"
      - "mise which mvnd"
      - "mvnd --version"
    notes: "Maven Daemon managed directly by mise and maintained separately from standalone Maven. A runtime version probe can initialize daemon state or fail to emit captured output in restricted non-interactive shells; use a bounded timeout and retain mise inventory plus command-resolution evidence."
  - id: "rust"
    command: "rustc"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "runtime"
    version_policy: "latest"
    check:
      - "rustc --version"
      - "cargo --version"
    notes: "Rust compiler and Cargo toolchain; manage shared/global Rust through mise rather than rustup."
  - id: "node"
    command: "node"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "runtime"
    version_policy: "latest"
    check:
      - "node --version"
      - "npm --version"
    notes: "Node.js runtime used by frontend, CLI, and agent tooling."
  - id: "npm"
    command: "npm"
    manager_chain:
      - "mise"
    install_strategy: "node-bundled"
    update_owner: "mise"
    category: "package-manager"
    version_policy: "latest"
    check:
      - "npm --version"
      - "npm prefix --global"
      - "npm list --global --depth=0"
    notes: "Node package manager supplied by the active mise-managed Node unless separately pinned through mise. Its global prefix changes when the active Node version changes."
  - id: "codex"
    command: "codex"
    package: "@openai/codex"
    manager_chain:
      - "npm"
      - "mise"
    install_strategy: "npm-global"
    update_owner: "npm"
    category: "agent-tool"
    version_policy: "latest"
    check:
      - "codex --version"
    notes: "Codex CLI npm package. Keep npm as the lifecycle owner so npm-based built-in updates target the active installation. Reinstall it through the Node postinstall policy when a new Node version is installed."
  - id: "pnpm"
    command: "pnpm"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "package-manager"
    version_policy: "latest"
    check:
      - "pnpm --version"
    notes: "Node package manager."
  - id: "python"
    command: "python"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "runtime"
    version_policy: "latest"
    check:
      - "python --version"
    notes: "Python runtime for scripts and local automation."
  - id: "uv"
    command: "uv"
    manager_chain:
      - "mise"
    install_strategy: "mise"
    update_owner: "mise"
    category: "package-manager"
    version_policy: "latest"
    check:
      - "uv --version"
    notes: "Python package and project tool."
manager_notes:
  scoop:
    platform: "windows"
    role: "Windows package manager and prerequisite path for mise."
  mise:
    platform: "windows-macos-linux"
    role: "Cross-platform runtime/version manager and optional outer lifecycle manager for backend-provisioned tools."
  npm:
    platform: "windows-macos-linux"
    role: "Direct package manager or ecosystem owner for npm packages; the active npm runtime can be supplied by mise-managed Node."
  brew:
    platform: "macos"
    role: "macOS package manager for tools better managed through Homebrew."
